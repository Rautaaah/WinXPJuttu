      const hour =

       * MORNING
       */

      if (hour >= 6 && hour < 12) {

        wallpaper =
          "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdHV6ZTR1Zzg4NTF3dHZsOW1vNGtoOGxncTRybGpsamw1bHQzMWt0MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13ZzYXkeIjcZy0/giphy.gif";

      }


      /*
       * AFTERNOON
       */

      else if (hour >= 12 && hour < 18) {

        wallpaper =
          "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExam5kM2l4bGt3bzZnZWRxbGR2MWxsZ2VuNzVsdmczZ2d4Z2J1bjRtMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NKicvKt6iisXS/giphy.gif";

      }


      /*
       * NIGHT
       */

      else {

        wallpaper =
          "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcmhsaDV5eDc4am52aXA3YzBlN21jNnRrOWt0c2xlbjBnZWNiaGJ0NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lR5poYluERnRuaGQOd/giphy.gif";

<!-- =====================================================
     DESKTOP ICON DRAG & DROP SYSTEM
     ===================================================== -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {

    const desktop =
      document.getElementById(
        "desktop"
      );

    if (!desktop) return;


    const icons =
      desktop.querySelectorAll(
        ".icon"
      );


    let draggedIcon = null;

    let offsetX = 0;

    let offsetY = 0;


    /*
     * =================================================
     * DESKTOP GRID
     * =================================================
     *
     * Change these values if you want the grid
     * spacing to be different.
     */

    const GRID_X = 20;

    const GRID_Y = 70;


    /*
     * Snap a position to the desktop grid.
     */

    function snapToGrid(
      x,
      y
    ) {

      return {

        x:
          Math.round(
            x / GRID_X
          ) * GRID_X,

        y:
          Math.round(
            y / GRID_Y
          ) * GRID_Y

      };

    }


    const defaultPositions = [

      [20, 20],

      [20, 90],

      [20, 160],

      [20, 230],

      [20, 300],

      [20, 370],

      [20, 440],

      [20, 510],

    ];


    /*
     * =================================================
     * LOAD DESKTOP ICON POSITIONS
     * =================================================
     */

    icons.forEach(
      function (
        icon,
        index
      ) {

        const key =
          "desktop-icon-" +
          (
            icon.dataset.icon ||
            index
          );


        const savedPosition =
          localStorage.getItem(
            key
          );


        if (savedPosition) {

          try {

            const position =
              JSON.parse(
                savedPosition
              );


            icon.style.left =
              position.x +
              "px";


            icon.style.top =
              position.y +
              "px";


          }

          catch (error) {

            console.warn(
              "Could not restore icon position:",
              error
            );

          }

        }

        else {

          if (
            defaultPositions[index]
          ) {

            icon.style.left =
              defaultPositions[index][0] +
              "px";


            icon.style.top =
              defaultPositions[index][1] +
              "px";

          }

        }


        /*
         * =================================================
         * MOUSE DRAG
         * =================================================
         */

        icon.addEventListener(
          "mousedown",
          function (event) {

            if (
              event.button !== 0
            ) return;


            draggedIcon =
              icon;


            const rect =
              icon.getBoundingClientRect();


            offsetX =
              event.clientX -
              rect.left;


            offsetY =
              event.clientY -
              rect.top;


            icon.classList.add(
              "dragging"
            );


            event.preventDefault();

          }
        );


        /*
         * =================================================
         * TOUCH DRAG
         * =================================================
         */

        icon.addEventListener(
          "touchstart",
          function (event) {

            const touch =
              event.touches[0];


            const rect =
              icon.getBoundingClientRect();


            draggedIcon =
              icon;


            offsetX =
              touch.clientX -
              rect.left;


            offsetY =
              touch.clientY -
              rect.top;


            icon.classList.add(
              "dragging"
            );

          },
          {
            passive: true
          }
        );

      }
    );


    /*
     * =================================================
     * MOUSE MOVE
     * =================================================
     */

    document.addEventListener(
      "mousemove",
      function (event) {

        if (
          !draggedIcon
        ) return;


        const desktopRect =
          desktop.getBoundingClientRect();


        let x =
          event.clientX -
          desktopRect.left -
          offsetX;


        let y =
          event.clientY -
          desktopRect.top -
          offsetY;


        const maxX =
          desktop.clientWidth -
          draggedIcon.offsetWidth;


        const maxY =
          desktop.clientHeight -
          draggedIcon.offsetHeight;


        x =
          Math.max(
            0,
            Math.min(
              x,
              maxX
            )
          );


        y =
          Math.max(
            0,
            Math.min(
              y,
              maxY
            )
          );


        draggedIcon.style.left =
          x + "px";


        draggedIcon.style.top =
          y + "px";

      }
    );


    /*
     * =================================================
     * TOUCH MOVE
     * =================================================
     */

    document.addEventListener(
      "touchmove",
      function (event) {

        if (
          !draggedIcon
        ) return;


        const touch =
          event.touches[0];


        const desktopRect =
          desktop.getBoundingClientRect();


        let x =
          touch.clientX -
          desktopRect.left -
          offsetX;


        let y =
          touch.clientY -
          desktopRect.top -
          offsetY;


        const maxX =
          desktop.clientWidth -
          draggedIcon.offsetWidth;


        const maxY =
          desktop.clientHeight -
          draggedIcon.offsetHeight;


        x =
          Math.max(
            0,
            Math.min(
              x,
              maxX
            )
          );


        y =
          Math.max(
            0,
            Math.min(
              y,
              maxY
            )
          );


        draggedIcon.style.left =
          x + "px";


        draggedIcon.style.top =
          y + "px";


      },
      {
        passive: false
      }
    );


    /*
     * =================================================
     * RELEASE ICON
     * =================================================
     */

    document.addEventListener(
      "mouseup",
      function () {

        if (
          !draggedIcon
        ) return;


        /*
         * Snap the icon when released.
         */

        const currentX =
          parseInt(
            draggedIcon.style.left
          ) || 0;


        const currentY =
          parseInt(
            draggedIcon.style.top
          ) || 0;


        const snapped =
          snapToGrid(
            currentX,
            currentY
          );


        draggedIcon.style.left =
          snapped.x + "px";


        draggedIcon.style.top =
          snapped.y + "px";


        saveIconPosition(
          draggedIcon
        );


        draggedIcon.classList.remove(
          "dragging"
        );


        draggedIcon =
          null;

      }
    );


    /*
     * =================================================
     * RELEASE TOUCH
     * =================================================
     */

    document.addEventListener(
      "touchend",
      function () {

        if (
          !draggedIcon
        ) return;


        const currentX =
          parseInt(
            draggedIcon.style.left
          ) || 0;


        const currentY =
          parseInt(
            draggedIcon.style.top
          ) || 0;


        const snapped =
          snapToGrid(
            currentX,
            currentY
          );


        draggedIcon.style.left =
          snapped.x + "px";


        draggedIcon.style.top =
          snapped.y + "px";


        saveIconPosition(
          draggedIcon
        );


        draggedIcon.classList.remove(
          "dragging"
        );


        draggedIcon =
          null;

      }
    );


    /*
     * =================================================
     * SAVE ICON POSITION
     * =================================================
     */

    function saveIconPosition(
      icon
    ) {

      const key =
        "desktop-icon-" +
        (
          icon.dataset.icon ||
          "unknown"
        );


      const position = {

        x:
          parseInt(
            icon.style.left
          ) || 0,

        y:
          parseInt(
            icon.style.top
          ) || 0

      };


      localStorage.setItem(
        key,
        JSON.stringify(
          position
        )
      );

    }

  }
);

</script>

        "is this where i live now?"

      ],


      "Recycle Bin (empty)": [

        "the void.",

        "there is NOTHING in there.",

        "you threw nothing away.",

        "empty. just like my soul.",

        "the Recycle Bin has been spared.",

        "what were you expecting to find?"

      ],


      "Internet Explorer 6": [

        "INTERNET EXPLORER?!",

        "WHY.",

        "you actually opened Internet Explorer.",

        "this browser is older than half the internet.",

        "please don't browse anything.",

        "the internet is not ready for this."

      ],


      "Minesweeper": [

        "MINESWEEPER.",

        "don't click the bombs.",

        "this is serious business.",

        "Berdly would be screaming right now.",

        "okay. time to gamble.",

        "one wrong click and it's over."

      ],


      "Space Cadet Pinball": [

        "PINBALL?!",

        "SPACE CADET.",

        "now THIS is a good game.",

        "send it.",

        "FLIPPERS.",

        "i'm rooting for you."

      ],


      "Paint": [

        "PAINT.",

        "time to draw something stupid.",

        "MS Paint my beloved.",

        "make me a masterpiece.",

        "i hope you draw me.",

        "pixel art time."

      ],


      "Notepad": [

        "NOTEPAD.",

        "time to write secrets.",

        "don't type anything embarrassing.",

        "i can see what you're writing.",

        "probably.",

        "this is where lore begins."

      ]

    };


    /*
     * =================================================
     * SPECIAL WINAMP REACTIONS
     * =================================================
     */

    const winampReactions = [

      "WINAMP.",

      "IT REALLY WHIPS THE LLAMA'S ASS.",

      "oh we're listening to music now.",

      "music time.",

      "WINAMP?? in 2026??",

      "excellent choice.",

      "play something good."

    ];


    /*
     * =================================================
     * RANDOM QUOTE
     * =================================================
     */

    function randomQuote(
      list
    ) {

      return list[
        Math.floor(
          Math.random() *
          list.length
        )
      ];

    }


    /*
     * =================================================
     * TALK
     * =================================================
     */

    function talk(
      message,
      duration = NORMAL_TALK_TIME
    ) {

      clearTimeout(
        dialogueTimer
      );


      dialogueText.textContent =
        message;


      dialogue.classList.remove(
        "hidden"
      );


      dialogueTimer =
        setTimeout(
          function () {

            dialogue.classList.add(
              "hidden"
            );

          },
          duration
        );

    }


    /*
     * =================================================
     * REACT TO WINDOW
     * =================================================
     */

    window.krisReactToWindow =
      function (
        windowName
      ) {

        let reaction;


        if (
          openingReactions[
            windowName
          ]
        ) {

          reaction =
            randomQuote(
              openingReactions[
                windowName
              ]
            );

        }

        else {

          reaction =
            randomQuote(
              quotes
            );

        }


        /*
         * React VERY quickly.
         */

        talk(
          reaction,
          REACTION_TIME
        );

      };


    /*
     * =================================================
     * INTERCEPT openWindow
     * =================================================
     *
     * This makes Kris react whenever your existing
     * openWindow() function is called.
     */

    if (
      typeof window.openWindow ===
      "function"
    ) {

      const originalOpenWindow =
        window.openWindow;


      window.openWindow =
        function (
          windowName
        ) {

          /*
           * First let the actual website
           * open the window.
           */

          const result =
            originalOpenWindow.apply(
              this,
              arguments
            );


          /*
           * Then let Kris react.
           */

          setTimeout(
            function () {

              if (
                window.krisReactToWindow
              ) {

                window.krisReactToWindow(
                  windowName
                );

              }

            },
            80
          );


          return result;

        };

    }


    /*
     * =================================================
     * INTERCEPT WINAMP
     * =================================================
     */

    if (
      typeof window.openRawWinamp ===
      "function"
    ) {

      const originalWinamp =
        window.openRawWinamp;


      window.openRawWinamp =
        function () {

          const result =
            originalWinamp.apply(
              this,
              arguments
            );


          setTimeout(
            function () {

              talk(
                randomQuote(
                  winampReactions
                ),
                REACTION_TIME
              );

            },
            80
          );


          return result;

        };

    }


    /*
     * =================================================
     * KRIS GRID SNAP
     * =================================================
     */

    function snapKrisToGrid(
      x,
      y
    ) {

      return {

        x:
          Math.round(
            x / KRIS_GRID_X
          ) * KRIS_GRID_X,

        y:
          Math.round(
            y / KRIS_GRID_Y
          ) * KRIS_GRID_Y

      };

    }


    /*
     * =================================================
     * DRAG KRIS
     * =================================================
     */

    kris.addEventListener(
      "mousedown",
      function (event) {

        if (
          event.button !== 0
        ) return;


        /*
         * CRITICAL:
         *
         * Stop the event BEFORE the desktop icon
         * drag system can see it.
         *
         * This prevents My Computer or another icon
         * from being dragged together with Kris.
         */

        event.preventDefault();

        event.stopPropagation();

        event.stopImmediatePropagation();


        dragging = true;


        const rect =
          kris.getBoundingClientRect();


        offsetX =
          event.clientX -
          rect.left;


        offsetY =
          event.clientY -
          rect.top;


        kris.classList.add(
          "dragging"
        );


        kris.classList.add(
          "grid-preview"
        );


        talk(
          randomQuote(
            dragQuotes
          ),
          1200
        );

      },
      true
    );


    /*
     * =================================================
     * DRAG KRIS WITH MOUSE
     * =================================================
     */

    document.addEventListener(
      "mousemove",
      function (event) {

        if (!dragging) return;


        event.preventDefault();

        event.stopPropagation();


        const desktopRect =
          desktop.getBoundingClientRect();


        let x =
          event.clientX -
          desktopRect.left -
          offsetX;


        let y =
          event.clientY -
          desktopRect.top -
          offsetY;


        const maxX =
          Math.max(
            0,
            desktop.clientWidth -
            kris.offsetWidth
          );


        const maxY =
          Math.max(
            0,
            desktop.clientHeight -
            kris.offsetHeight
          );


        x =
          Math.max(
            0,
            Math.min(
              x,
              maxX
            )
          );


        y =
          Math.max(
            0,
            Math.min(
              y,
              maxY
            )
          );


        /*
         * =================================================
         * LIVE GRID SNAP
         * =================================================
         *
         * Kris actually moves along the same grid
         * instead of only snapping when released.
         */

        const snapped =
          snapKrisToGrid(
            x,
            y
          );


        kris.style.left =
          snapped.x +
          "px";


        kris.style.top =
          snapped.y +
          "px";

      },
      true
    );


    /*
     * =================================================
     * RELEASE KRIS
     * =================================================
     */

    document.addEventListener(
      "mouseup",
      function (event) {

        if (!dragging) return;


        event.preventDefault();

        event.stopPropagation();


        dragging = false;


        /*
         * Make absolutely sure the final position
         * is on the grid.
         */

        const currentX =
          parseInt(
            kris.style.left
          ) || 0;


        const currentY =
          parseInt(
            kris.style.top
          ) || 0;


        const snapped =
          snapKrisToGrid(
            currentX,
            currentY
          );


        kris.style.left =
          snapped.x +
          "px";


        kris.style.top =
          snapped.y +
          "px";


        kris.classList.remove(
          "dragging"
        );


        kris.classList.remove(
          "grid-preview"
        );


        /*
         * Save Kris position.
         */

        localStorage.setItem(
          "kris-companion-position",
          JSON.stringify({

            x:
              snapped.x,

            y:
              snapped.y

          })
        );


        /*
         * Immediately yap after being placed.
         */

        talk(
          randomQuote(
            dragQuotes
          ),
          1000
        );

      },
      true
    );


    /*
     * =================================================
     * TOUCH SUPPORT
     * =================================================
     */

    kris.addEventListener(
      "touchstart",
      function (event) {

        const touch =
          event.touches[0];


        const rect =
          kris.getBoundingClientRect();


        dragging = true;


        offsetX =
          touch.clientX -
          rect.left;


        offsetY =
          touch.clientY -
          rect.top;


        kris.classList.add(
          "dragging"
        );


        kris.classList.add(
          "grid-preview"
        );


        talk(
          randomQuote(
            dragQuotes
          ),
          1200
        );

      },
      {
        passive: true
      }
    );


    /*
     * =================================================
     * TOUCH MOVE
     * =================================================
     */

    document.addEventListener(
      "touchmove",
      function (event) {

        if (!dragging) return;


        event.preventDefault();


        const touch =
          event.touches[0];


        const desktopRect =
          desktop.getBoundingClientRect();


        let x =
          touch.clientX -
          desktopRect.left -
          offsetX;


        let y =
          touch.clientY -
          desktopRect.top -
          offsetY;


        const maxX =
          Math.max(
            0,
            desktop.clientWidth -
            kris.offsetWidth
          );


        const maxY =
          Math.max(
            0,
            desktop.clientHeight -
            kris.offsetHeight
          );


        x =
          Math.max(
            0,
            Math.min(
              x,
              maxX
            )
          );


        y =
          Math.max(
            0,
            Math.min(
              y,
              maxY
            )
          );


        const snapped =
          snapKrisToGrid(
            x,
            y
          );


        kris.style.left =
          snapped.x +
          "px";


        kris.style.top =
          snapped.y +
          "px";

      },
      {
        passive: false
      }
    );


    /*
     * =================================================
     * TOUCH END
     * =================================================
     */

    document.addEventListener(
      "touchend",
      function (event) {

        if (!dragging) return;


        dragging = false;


        const currentX =
          parseInt(
            kris.style.left
          ) || 0;


        const currentY =
          parseInt(
            kris.style.top
          ) || 0;


        const snapped =
          snapKrisToGrid(
            currentX,
            currentY
          );


        kris.style.left =
          snapped.x +
          "px";


        kris.style.top =
          snapped.y +
          "px";


        kris.classList.remove(
          "dragging"
        );


        kris.classList.remove(
          "grid-preview"
        );


        localStorage.setItem(
          "kris-companion-position",
          JSON.stringify({

            x:
              snapped.x,

            y:
              snapped.y

          })
        );

      }
    );


    /*
     * =================================================
     * RESTORE KRIS POSITION
     * =================================================
     */

    const savedPosition =
      localStorage.getItem(
        "kris-companion-position"
      );


    if (savedPosition) {

      try {

        const position =
          JSON.parse(
            savedPosition
          );


        kris.style.left =
          position.x +
          "px";


        kris.style.top =
          position.y +
          "px";

      }

      catch (error) {

        console.warn(
          "Kris Companion: Couldn't restore position.",
          error
        );

      }

    }


    /*
     * =================================================
     * FIRST MESSAGE
     * =================================================
     */

    setTimeout(
      function () {

        talk(
          "oh. you found me.",
          2500
        );

      },
      1000
    );


    /*
     * =================================================
     * FAST RANDOM YAPPING
     * =================================================
     *
     * Kris now talks MUCH more frequently.
     *
     * Instead of waiting a long time between
     * comments, he picks a new random delay
     * between roughly 3 and 7 seconds.
     */

    function randomComment() {

      if (!dragging) {

        talk(
          randomQuote(
            quotes
          ),
          NORMAL_TALK_TIME
        );

      }


      const nextDelay =
        3000 +
        Math.random() * 4000;


      randomCommentTimer =
        setTimeout(
          randomComment,
          nextDelay
        );

    }


    setTimeout(
      randomComment,
      3500
    );


    /*
     * =================================================
     * EXTRA ULTRA-FAST BURSTS
     * =================================================
     *
     * Sometimes Kris gets REALLY annoying and
     * starts yapping multiple times in quick
     * succession.
     */

    function yapBurst() {

      if (!dragging) {

        talk(
          randomQuote(
            quotes
          ),
          900
        );

      }


      const nextBurst =
        15000 +
        Math.random() * 25000;


      setTimeout(
        yapBurst,
        nextBurst
      );

    }


    setTimeout(
      yapBurst,
      12000
    );

  }
);

</script>
