  </head>

  <body>

    <div
      id="main-content"
      style="
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
        min-height: 100vh;
      "
    >

      <!-- ================================= -->
      <!-- AUTOMATIC TIME-BASED WALLPAPER    -->
      <!-- ================================= -->

      <script>
        function updateDesktopWallpaper() {
          const hour = new Date().getHours();

          let wallpaper;

          /*
           * MORNING
           * 06:00 - 11:59
           */
          if (hour >= 6 && hour < 12) {
            wallpaper =
              "https://media1.tenor.com/m/NkqanKk4XmYAAAAd/%D0%B9%D1%86%D1%83.gif";
          }

          /*
           * AFTERNOON
           * 12:00 - 17:59
           */
          else if (hour >= 12 && hour < 18) {
            wallpaper =
              "https://media1.tenor.com/m/cphmUyMjQ60AAAAd/sakura.gif";
          }

          /*
           * NIGHT
           * 18:00 - 05:59
           */
          else {
            wallpaper =
              "https://media1.tenor.com/m/UymJ9Gn-nf0AAAAd/%D1%8B.gif";
          }

          document.getElementById("main-content").style.backgroundImage =
            `url("${wallpaper}")`;
        }

        // Set wallpaper immediately when the desktop loads
        updateDesktopWallpaper();

        // Check again every minute
        setInterval(updateDesktopWallpaper, 60000);
      </script>


      <!-- ================================= -->
