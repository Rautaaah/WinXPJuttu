   * DRAGGABLE DESKTOP ICONS

   */

  #desktop {

  #kris-companion {

    cursor: grab;

    z-index: 99999;

  #kris-gif {
    position: absolute;

    left: 15px;
    bottom: 0;

    width: 120px;
    height: auto;

    pointer-events: none;

    user-select: none;
    -webkit-user-drag: none;
  }


  /*
   * =====================================================
   * KRIS DIALOGUE BOX
   * =====================================================
   */

  #kris-dialogue {
    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    min-width: 190px;
    max-width: 270px;

    padding: 10px 12px;

    box-sizing: border-box;

    background: #000;

    border: 3px solid #fff;

    color: #fff;

    font-family: "Courier New", monospace;

    font-size: 14px;
    font-weight: bold;

    line-height: 1.3;

    z-index: 10000;

    pointer-events: none;

    box-shadow: 3px 3px 0 #000;
  }


  #kris-dialogue.hidden {
    display: none;
  }


  #kris-dialogue::after {
    content: "";

    position: absolute;

    left: 50%;
    bottom: -9px;

    width: 12px;
    height: 12px;

    background: #000;

    border-right: 3px solid #fff;
    border-bottom: 3px solid #fff;

    transform:
      translateX(-50%)
      rotate(45deg);
  }


  #kris-dialogue-text::after {
    content: "▮";

    margin-left: 3px;

    animation:
      kris-cursor 0.7s steps(1) infinite;
  }


  @keyframes kris-cursor {

    0%,
    50% {
      opacity: 1;
    }

    51%,
    100% {
      opacity: 0;
    }

  }

        wallpaper =

      }

      const desktop =
        document.getElementById("main-content");

      if (desktop) {
        desktop.style.backgroundImage =

<!-- =================================================
     DESKTOP ICON DRAG & DROP
     ================================================= -->

<script>

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      const desktop =
        document.getElementById("desktop");

      if (!desktop) return;


      const icons =
        desktop.querySelectorAll(".icon");


      let draggedIcon = null;

      let offsetX = 0;
      let offsetY = 0;


      const defaultPositions = [

        [20, 20],
        [20, 90],
        [20, 160],
        [20, 230],
        [20, 300],
        [20, 370],
        [20, 440],
        [20, 510]

      ];


      icons.forEach(
        (icon, index) => {

          const key =
            "desktop-icon-" +
            (
              icon.dataset.icon ||
              index
            );


          const savedPosition =
            localStorage.getItem(key);


          if (savedPosition) {

            try {

              const position =
                JSON.parse(
                  savedPosition
                );

              icon.style.left =
                position.x + "px";

              icon.style.top =
                position.y + "px";

            } catch (error) {

              console.warn(
                "Could not restore icon position:",
                error
              );

            }

          } else {

            if (
              defaultPositions[index]
            ) {

              icon.style.left =
                defaultPositions[index][0] +
                "px";

              icon.style.top =
                defaultPositions[index][1] +
                "px";

            }

          }


          icon.addEventListener(
            "mousedown",
            function (event) {

              if (event.button !== 0) {
                return;
              }

              draggedIcon = icon;

              const rect =
                icon.getBoundingClientRect();

              offsetX =
                event.clientX -
                rect.left;

              offsetY =
                event.clientY -
                rect.top;

              icon.classList.add(
                "dragging"
              );

              event.preventDefault();

            }
          );


          icon.addEventListener(
            "touchstart",
            function (event) {

              const touch =
                event.touches[0];

              const rect =
                icon.getBoundingClientRect();

              draggedIcon = icon;

              offsetX =
                touch.clientX -
                rect.left;

              offsetY =
                touch.clientY -
                rect.top;

              icon.classList.add(
                "dragging"
              );

            },
            {
              passive: true
            }
          );

        }
      );


      document.addEventListener(
        "mousemove",
        function (event) {

          if (!draggedIcon) return;


          const desktopRect =
            desktop.getBoundingClientRect();


          let x =
            event.clientX -
            desktopRect.left -
            offsetX;


          let y =
            event.clientY -
            desktopRect.top -
            offsetY;


          const maxX =
            desktop.clientWidth -
            draggedIcon.offsetWidth;


          const maxY =
            desktop.clientHeight -
            draggedIcon.offsetHeight;


          x =
            Math.max(
              0,
              Math.min(
                x,
                maxX
              )
            );


          y =
            Math.max(
              0,
              Math.min(
                y,
                maxY
              )
            );


          draggedIcon.style.left =
            x + "px";

          draggedIcon.style.top =
            y + "px";

        }
      );


      document.addEventListener(
        "touchmove",
        function (event) {

          if (!draggedIcon) return;


          const touch =
            event.touches[0];


          const desktopRect =
            desktop.getBoundingClientRect();


          let x =
            touch.clientX -
            desktopRect.left -
            offsetX;


          let y =
            touch.clientY -
            desktopRect.top -
            offsetY;


          const maxX =
            desktop.clientWidth -
            draggedIcon.offsetWidth;


          const maxY =
            desktop.clientHeight -
            draggedIcon.offsetHeight;


          x =
            Math.max(
              0,
              Math.min(
                x,
                maxX
              )
            );


          y =
            Math.max(
              0,
              Math.min(
                y,
                maxY
              )
            );


          draggedIcon.style.left =
            x + "px";

          draggedIcon.style.top =
            y + "px";


          event.preventDefault();

        },
        {
          passive: false
        }
      );


      document.addEventListener(
        "mouseup",
        function () {

          if (!draggedIcon) return;


          saveIconPosition(
            draggedIcon
          );


          draggedIcon.classList.remove(
            "dragging"
          );


          draggedIcon = null;

        }
      );


      document.addEventListener(
        "touchend",
        function () {

          if (!draggedIcon) return;


          saveIconPosition(
            draggedIcon
          );


          draggedIcon.classList.remove(
            "dragging"
          );


          draggedIcon = null;

        }
      );


      function saveIconPosition(icon) {

        const key =
          "desktop-icon-" +
          (
            icon.dataset.icon ||
            "unknown"
          );


        const position = {

          x:
            parseInt(
              icon.style.left
            ) || 0,

          y:
            parseInt(
              icon.style.top
            ) || 0

        };


        localStorage.setItem(
          key,
          JSON.stringify(position)
        );

      }

    }
  );

</script>


<!-- =================================================
     KRIS COMPANION
     ================================================= -->

<script>

  document.addEventListener(
    "DOMContentLoaded",
    function () {

      const kris =
        document.getElementById(
          "kris-companion"
        );

      const desktop =
        document.getElementById(
          "desktop"
        );

      const dialogue =
        document.getElementById(
          "kris-dialogue"
        );

      const dialogueText =
        document.getElementById(
          "kris-dialogue-text"
        );


      if (
        !kris ||
        !desktop
      ) {

        console.error(
          "Kris Companion: elements missing."
        );

        return;

      }


      let dragging = false;

      let offsetX = 0;
      let offsetY = 0;

      let dialogueTimer = null;


      const quotes = [

        "what are you doing.",

        "you opened that?",

        "wow.",

        "interesting.",

        "are you lost?",

        "i'm watching you.",

        "you really like clicking things.",

        "what are you looking for?",

        "this is productive.",

        "sure.",

        "...",

        "why are you still here?",

        "you've been here for a while.",

        "i saw that.",

        "stop clicking everything.",

        "okay.",

        "fascinating.",

        "you moved me.",

        "why did you move me?",

        "put me back.",

        "seriously?",

        "nice.",

        "windows xp.",

        "this website is weird.",

        "i'm just gonna stand here.",

        "you know i'm dancing, right?",

        "you have too much free time.",

        "i'm judging you.",

        "..."

      ];


      const dragQuotes = [

        "hey.",

        "why are you moving me?",

        "put me down.",

        "seriously?",

        "where are we going?",

        "stop dragging me.",

        "i was comfortable there.",

        "bro.",

        "what are you doing."

      ];


      const idleQuotes = [

        "are you still there?",

        "hello?",

        "you stopped moving.",

        "did you fall asleep?",

        "...",

        "i'm getting bored.",

        "you still there?",

        "what happened?"

      ];


      function randomQuote(list) {

        return list[
          Math.floor(
            Math.random() *
            list.length
          )
        ];

      }


      function talk(
        message,
        duration = 3500
      ) {

        if (
          !dialogue ||
          !dialogueText
        ) {
          return;
        }


        clearTimeout(
          dialogueTimer
        );


        dialogueText.textContent =
          message;


        dialogue.classList.remove(
          "hidden"
        );


        dialogueTimer =
          setTimeout(
            function () {

              dialogue.classList.add(
                "hidden"
              );

            },
            duration
          );

      }


      /*
       * Make Kris draggable.
       */

      kris.addEventListener(
        "mousedown",
        function (event) {

          if (
            event.button !== 0
          ) {
            return;
          }


          dragging = true;


          const rect =
            kris.getBoundingClientRect();


          offsetX =
            event.clientX -
            rect.left;


          offsetY =
            event.clientY -
            rect.top;


          kris.classList.add(
            "dragging"
          );


          talk(
            randomQuote(
              dragQuotes
            ),
            1600
          );


          event.preventDefault();

        }
      );


      document.addEventListener(
        "mousemove",
        function (event) {

          if (!dragging) {
            return;
          }


          const desktopRect =
            desktop.getBoundingClientRect();


          let x =
            event.clientX -
            desktopRect.left -
            offsetX;


          let y =
            event.clientY -
            desktopRect.top -
            offsetY;


          const maxX =
            desktop.clientWidth -
            kris.offsetWidth;


          const maxY =
            desktop.clientHeight -
            kris.offsetHeight;


          x =
            Math.max(
              0,
              Math.min(
                x,
                maxX
              )
            );


          y =
            Math.max(
              0,
              Math.min(
                y,
                maxY
              )
            );


          kris.style.left =
            x + "px";


          kris.style.top =
            y + "px";

        }
      );


      document.addEventListener(
        "mouseup",
        function () {

          if (!dragging) {
            return;
          }


          dragging = false;


          kris.classList.remove(
            "dragging"
          );


          saveKrisPosition();

        }
      );


      /*
       * Save Kris' position.
       */

      function saveKrisPosition() {

        const position = {

          x:
            parseInt(
              kris.style.left
            ) || 0,

          y:
            parseInt(
              kris.style.top
            ) || 0

        };


        localStorage.setItem(
          "kris-companion-position",
          JSON.stringify(
            position
          )
        );

      }


      /*
       * Restore Kris' position.
       */

      function restoreKrisPosition() {

        const saved =
          localStorage.getItem(
            "kris-companion-position"
          );


        if (!saved) {
          return;
        }


        try {

          const position =
            JSON.parse(saved);


          if (
            typeof position.x !==
              "number" ||
            typeof position.y !==
              "number"
          ) {
            return;
          }


          kris.style.left =
            position.x + "px";


          kris.style.top =
            position.y + "px";


        } catch (error) {

          console.warn(
            "Kris position could not be restored:",
            error
          );

        }

      }


      restoreKrisPosition();


      /*
       * First message.
       */

      setTimeout(
        function () {

          talk(
            "oh. you found me.",
            4000
          );

        },
        1500
      );


      /*
       * Random talking.
       */

      function randomComment() {

        if (!dragging) {

          talk(
            randomQuote(quotes),
            3500
          );

        }


        const delay =
          12000 +
          Math.random() * 18000;


        setTimeout(
          randomComment,
          delay
        );

      }


      setTimeout(
        randomComment,
        12000
      );


      /*
       * Idle detection.
       */

      let lastActivity =
        Date.now();

      let idleTriggered = false;


      function activity() {

        lastActivity =
          Date.now();

        idleTriggered = false;

      }


      document.addEventListener(
        "mousemove",
        activity
      );


      document.addEventListener(
        "mousedown",
        activity
      );


      document.addEventListener(
        "keydown",
        activity
      );


      setInterval(
        function () {

          const idleTime =
            Date.now() -
            lastActivity;


          if (
            idleTime >= 30000 &&
            !idleTriggered &&
            !dragging
          ) {

            idleTriggered = true;


            talk(
              randomQuote(
                idleQuotes
              ),
              4000
            );

          }

        },
        5000
      );

    }
  );

</script>
