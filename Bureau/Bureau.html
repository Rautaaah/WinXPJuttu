<script>
document.addEventListener("DOMContentLoaded", function () {

  const music = document.getElementById("desktop-music");

  function startMusic() {

    music.volume = 0.5;

    music.play().catch(function () {
      console.log("Browser blocked autoplay.");
    });

    document.removeEventListener(
      "click",
      startMusic
    );

  }

  /*
   * Try immediately.
   */
  music.play().catch(function () {

    /*
     * If the browser blocks autoplay,
     * start it after the user's first click.
     */
    document.addEventListener(
      "click",
      startMusic,
      { once: true }
    );

  });

});
</script>

<script>
/* =====================================================
   DESKTOP ICON DRAG + MULTI-SELECTION + 19x8 GRID
   ===================================================== */

document.addEventListener("DOMContentLoaded", function () {

  const desktop = document.getElementById("desktop");

  if (!desktop) return;


  /* =====================================================
     SETTINGS
     ===================================================== */

  const GRID_COLUMNS = 19;
  const GRID_ROWS = 8;

  const icons = Array.from(
    desktop.querySelectorAll(".icon")
  );


  /* =====================================================
     SELECTION FRAME
     ===================================================== */

  let selectionFrame =
    document.getElementById("desktop-selection-frame");

  if (!selectionFrame) {

    selectionFrame =
      document.createElement("div");

    selectionFrame.id =
      "desktop-selection-frame";

    document.body.appendChild(
      selectionFrame
    );

  }


  /* =====================================================
     STATE
     ===================================================== */

  let selecting = false;

  let dragging = false;

  let draggedIcons = [];

  let selectionStartX = 0;

  let selectionStartY = 0;

  let dragStartMouseX = 0;

  let dragStartMouseY = 0;

  let originalPositions = [];


  /* =====================================================
     GRID
     ===================================================== */

  function getGridSize() {

    return {

      cellWidth:
        desktop.clientWidth /
        GRID_COLUMNS,

      cellHeight:
        desktop.clientHeight /
        GRID_ROWS

    };

  }


  function snapToGrid(x, y, icon) {

    const grid =
      getGridSize();


    /*
     * Keep the icon completely inside
     * the desktop.
     */

    const maxX =
      Math.max(
        0,
        desktop.clientWidth -
        icon.offsetWidth
      );

    const maxY =
      Math.max(
        0,
        desktop.clientHeight -
        icon.offsetHeight
      );


    let snappedX =
      Math.round(
        x /
        grid.cellWidth
      ) *
      grid.cellWidth;


    let snappedY =
      Math.round(
        y /
        grid.cellHeight
      ) *
      grid.cellHeight;


    snappedX =
      Math.max(
        0,
        Math.min(
          snappedX,
          maxX
        )
      );


    snappedY =
      Math.max(
        0,
        Math.min(
          snappedY,
          maxY
        )
      );


    return {

      x: Math.round(snappedX),

      y: Math.round(snappedY)

    };

  }


  /* =====================================================
     POSITION HELPERS
     ===================================================== */

  function getPosition(icon) {

    return {

      x:
        parseFloat(
          icon.style.left
        ) || 0,

      y:
        parseFloat(
          icon.style.top
        ) || 0

    };

  }


  function setPosition(icon, x, y) {

    icon.style.left =
      Math.round(x) +
      "px";

    icon.style.top =
      Math.round(y) +
      "px";

  }


  /* =====================================================
     CLEAR SELECTION
     ===================================================== */

  function clearSelection() {

    icons.forEach(
      function (icon) {

        icon.classList.remove(
          "desktop-selected"
        );

      }
    );

  }


  /* =====================================================
     SELECT ICONS INSIDE RECTANGLE
     ===================================================== */

  function updateSelection() {

    const left =
      Math.min(
        selectionStartX,
        window.event?.clientX ??
        selectionStartX
      );

    const top =
      Math.min(
        selectionStartY,
        window.event?.clientY ??
        selectionStartY
      );

  }


  function selectIconsInRectangle(
    rectangle
  ) {

    icons.forEach(
      function (icon) {

        const rect =
          icon.getBoundingClientRect();


        const intersects =
          rect.left <
            rectangle.right &&

          rect.right >
            rectangle.left &&

          rect.top <
            rectangle.bottom &&

          rect.bottom >
            rectangle.top;


        if (intersects) {

          icon.classList.add(
            "desktop-selected"
          );

        }

        else {

          icon.classList.remove(
            "desktop-selected"
          );

        }

      }
    );

  }


  /* =====================================================
     DESKTOP MOUSE DOWN
     ===================================================== */

  desktop.addEventListener(
    "mousedown",
    function (event) {

      if (event.button !== 0)
        return;


      /*
       * Clicking an icon starts
       * the icon drag system instead.
       */

      if (
        event.target.closest(".icon")
      ) {
        return;
      }


      /*
       * Don't select through windows.
       */

      if (
        event.target.closest(".window")
      ) {
        return;
      }


      selecting = true;


      selectionStartX =
        event.clientX;

      selectionStartY =
        event.clientY;


      selectionFrame.style.display =
        "block";


      selectionFrame.style.left =
        selectionStartX +
        "px";


      selectionFrame.style.top =
        selectionStartY +
        "px";


      selectionFrame.style.width =
        "0px";


      selectionFrame.style.height =
        "0px";


      clearSelection();


      event.preventDefault();

    }
  );


  /* =====================================================
     SELECTION MOUSE MOVE
     ===================================================== */

  document.addEventListener(
    "mousemove",
    function (event) {

      if (!selecting)
        return;


      const currentX =
        event.clientX;

      const currentY =
        event.clientY;


      const left =
        Math.min(
          selectionStartX,
          currentX
        );


      const top =
        Math.min(
          selectionStartY,
          currentY
        );


      const width =
        Math.abs(
          currentX -
          selectionStartX
        );


      const height =
        Math.abs(
          currentY -
          selectionStartY
        );


      selectionFrame.style.left =
        left +
        "px";


      selectionFrame.style.top =
        top +
        "px";


      selectionFrame.style.width =
        width +
        "px";


      selectionFrame.style.height =
        height +
        "px";


      const selectionRect =
        selectionFrame.getBoundingClientRect();


      selectIconsInRectangle(
        selectionRect
      );

    }
  );


  /* =====================================================
     SELECTION MOUSE UP
     ===================================================== */

  document.addEventListener(
    "mouseup",
    function () {

      if (!selecting)
        return;


      selecting = false;


      selectionFrame.style.display =
        "none";

    }
  );


  /* =====================================================
     ICON MOUSE DOWN
     ===================================================== */

  icons.forEach(
    function (icon) {

      icon.addEventListener(
        "mousedown",
        function (event) {

          if (event.button !== 0)
            return;


          /*
           * Don't allow the selection
           * rectangle to start.
           */

          event.stopPropagation();


          /*
           * If this icon isn't selected,
           * make it the only selected icon.
           *
           * If it IS selected, keep the
           * existing multi-selection.
           */

          if (
            !icon.classList.contains(
              "desktop-selected"
            )
          ) {

            clearSelection();

            icon.classList.add(
              "desktop-selected"
            );

          }


          draggedIcons =
            icons.filter(
              function (item) {

                return item.classList.contains(
                  "desktop-selected"
                );

              }
            );


          if (
            draggedIcons.length === 0
          ) {

            draggedIcons = [
              icon
            ];

          }


          dragging = true;


          dragStartMouseX =
            event.clientX;

          dragStartMouseY =
            event.clientY;


          originalPositions =
            draggedIcons.map(
              function (item) {

                const position =
                  getPosition(item);

                return {

                  icon: item,

                  x: position.x,

                  y: position.y

                };

              }
            );


          draggedIcons.forEach(
            function (item) {

              item.classList.add(
                "dragging"
              );

            }
          );


          event.preventDefault();

        }
      );


      /* =================================================
         TOUCH START
         ================================================= */

      icon.addEventListener(
        "touchstart",
        function (event) {

          const touch =
            event.touches[0];

          if (!touch)
            return;


          if (
            !icon.classList.contains(
              "desktop-selected"
            )
          ) {

            clearSelection();

            icon.classList.add(
              "desktop-selected"
            );

          }


          draggedIcons =
            icons.filter(
              function (item) {

                return item.classList.contains(
                  "desktop-selected"
                );

              }
            );


          if (
            draggedIcons.length === 0
          ) {

            draggedIcons = [
              icon
            ];

          }


          dragging = true;


          dragStartMouseX =
            touch.clientX;

          dragStartMouseY =
            touch.clientY;


          originalPositions =
            draggedIcons.map(
              function (item) {

                const position =
                  getPosition(item);

                return {

                  icon: item,

                  x: position.x,

                  y: position.y

                };

              }
            );


          draggedIcons.forEach(
            function (item) {

              item.classList.add(
                "dragging"
              );

            }
          );

        },
        {
          passive: true
        }
      );

    }
  );


  /* =====================================================
     MOVE SELECTED ICONS
     ===================================================== */

  document.addEventListener(
    "mousemove",
    function (event) {

      if (!dragging)
        return;


      const deltaX =
        event.clientX -
        dragStartMouseX;


      const deltaY =
        event.clientY -
        dragStartMouseY;


      originalPositions.forEach(
        function (original) {

          let x =
            original.x +
            deltaX;

          let y =
            original.y +
            deltaY;


          const maxX =
            Math.max(
              0,
              desktop.clientWidth -
              original.icon.offsetWidth
            );


          const maxY =
            Math.max(
              0,
              desktop.clientHeight -
              original.icon.offsetHeight
            );


          x =
            Math.max(
              0,
              Math.min(
                x,
                maxX
              )
            );


          y =
            Math.max(
              0,
              Math.min(
                y,
                maxY
              )
            );


          setPosition(
            original.icon,
            x,
            y
          );

        }
      );

    }
  );


  /* =====================================================
     TOUCH MOVE
     ===================================================== */

  document.addEventListener(
    "touchmove",
    function (event) {

      if (!dragging)
        return;


      const touch =
        event.touches[0];

      if (!touch)
        return;


      const deltaX =
        touch.clientX -
        dragStartMouseX;


      const deltaY =
        touch.clientY -
        dragStartMouseY;


      originalPositions.forEach(
        function (original) {

          let x =
            original.x +
            deltaX;

          let y =
            original.y +
            deltaY;


          const maxX =
            Math.max(
              0,
              desktop.clientWidth -
              original.icon.offsetWidth
            );


          const maxY =
            Math.max(
              0,
              desktop.clientHeight -
              original.icon.offsetHeight
            );


          x =
            Math.max(
              0,
              Math.min(
                x,
                maxX
              )
            );


          y =
            Math.max(
              0,
              Math.min(
                y,
                maxY
              )
            );


          setPosition(
            original.icon,
            x,
            y
          );

        }
      );


      event.preventDefault();

    },
    {
      passive: false
    }
  );


  /* =====================================================
     FINISH DRAG
     ===================================================== */

  function finishDrag() {

    if (!dragging)
      return;


    dragging = false;


    /*
     * Calculate how far the group moved.
     */

    if (
      originalPositions.length === 0
    ) {

      draggedIcons = [];

      return;

    }


    const firstOriginal =
      originalPositions[0];


    const firstCurrent =
      getPosition(
        firstOriginal.icon
      );


    const movedX =
      firstCurrent.x -
      firstOriginal.x;


    const movedY =
      firstCurrent.y -
      firstOriginal.y;


    /*
     * Snap the GROUP using the movement
     * of the first selected icon.
     *
     * This keeps selected icons together.
     */

    const snappedFirst =
      snapToGrid(
        firstOriginal.x +
        movedX,

        firstOriginal.y +
        movedY,

        firstOriginal.icon
      );


    const snapDeltaX =
      snappedFirst.x -
      firstCurrent.x;


    const snapDeltaY =
      snappedFirst.y -
      firstCurrent.y;


    originalPositions.forEach(
      function (original) {

        const current =
          getPosition(
            original.icon
          );


        let finalX =
          current.x +
          snapDeltaX;


        let finalY =
          current.y +
          snapDeltaY;


        const maxX =
          Math.max(
            0,
            desktop.clientWidth -
            original.icon.offsetWidth
          );


        const maxY =
          Math.max(
            0,
            desktop.clientHeight -
            original.icon.offsetHeight
          );


        finalX =
          Math.max(
            0,
            Math.min(
              finalX,
              maxX
            )
          );


        finalY =
          Math.max(
            0,
            Math.min(
              finalY,
              maxY
            )
          );


        setPosition(
          original.icon,
          finalX,
          finalY
        );


        saveIconPosition(
          original.icon
        );


        original.icon.classList.remove(
          "dragging"
        );

      }
    );


    draggedIcons = [];

    originalPositions = [];

  }


  /* =====================================================
     MOUSE UP
     ===================================================== */

  document.addEventListener(
    "mouseup",
    function () {

      finishDrag();

    },
    true
  );


  /* =====================================================
     TOUCH END
     ===================================================== */

  document.addEventListener(
    "touchend",
    function () {

      finishDrag();

    }
  );


  /* =====================================================
     SAVE POSITION
     ===================================================== */

  function saveIconPosition(icon) {

    const key =
      "desktop-icon-" +
      (
        icon.dataset.icon ||
        "unknown"
      );


    const position =
      getPosition(icon);


    localStorage.setItem(
      key,
      JSON.stringify({

        x:
          Math.round(
            position.x
          ),

        y:
          Math.round(
            position.y
          )

      })
    );

  }


  /* =====================================================
     RESTORE POSITIONS
     ===================================================== */

  const defaultPositions = [];


  /*
   * Create the initial positions using
   * the 19 x 8 grid.
   */

  icons.forEach(
    function (icon, index) {

      const key =
        "desktop-icon-" +
        (
          icon.dataset.icon ||
          index
        );


      const saved =
        localStorage.getItem(
          key
        );


      if (saved) {

        try {

          const position =
            JSON.parse(saved);


          setPosition(
            icon,
            position.x,
            position.y
          );


          return;

        }

        catch (error) {

          console.warn(
            "Could not restore icon position:",
            error
          );

        }

      }


      /*
       * Default layout:
       *
       * 19 columns
       * 8 rows
       */

      const column =
        Math.floor(
          index / GRID_ROWS
        );


      const row =
        index %
        GRID_ROWS;


      const grid =
        getGridSize();


      const x =
        column *
        grid.cellWidth;


      const y =
        row *
        grid.cellHeight;


      setPosition(
        icon,
        x,
        y
      );

    }
  );


  /* =====================================================
     KEEP GRID CORRECT AFTER RESIZE
     ===================================================== */

  let resizeTimer = null;


  window.addEventListener(
    "resize",
    function () {

      clearTimeout(
        resizeTimer
      );


      resizeTimer =
        setTimeout(
          function () {

            /*
             * We don't automatically move
             * saved icons on resize.
             *
             * This prevents icons from jumping
             * around unexpectedly.
             */

          },
          100
        );

    }
  );


});
</script>
