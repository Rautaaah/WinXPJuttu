    height: 12px;
    background: #000;

    border-bottom: 3px solid #fff;

    function updateDesktopWallpaper() {
      const hour = new Date().getHours();

      // MORNING — 06:00 to 11:59
      if (hour >= 6 && hour < 12) {
        wallpaper =
          "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdHV6ZTR1Zzg4NTF3dHZsOW1vNGtoOGxncTRybGpsamw1bHQzMWt0MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13ZzYXkeIjcZy0/giphy.gif";
      }

      // AFTERNOON — 12:00 to 17:59
      else if (hour >= 12 && hour < 18) {
        wallpaper =
          "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExam5kM2l4bGt3bzZnZWRxbGR2MWxsZ2VuNzVsdmczZ2d4Z2J1bjRtMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NKicvKt6iisXS/giphy.gif";

<!-- =================================================
     DESKTOP ICON DRAG & DROP SYSTEM
     ================================================= -->

<script>
  document.addEventListener("DOMContentLoaded", function () {

    const desktop = document.getElementById("desktop");

    if (!desktop) return;

    const icons = desktop.querySelectorAll(".icon");

    let draggedIcon = null;
    let offsetX = 0;
    let offsetY = 0;

    const defaultPositions = [
      [20, 20],
      [20, 90],
      [20, 160],
      [20, 230],
      [20, 300],
      [20, 370],
      [20, 440],
      [20, 510],
    ];

    icons.forEach((icon, index) => {

      const key =
        "desktop-icon-" +
        (icon.dataset.icon || index);

      const savedPosition =
        localStorage.getItem(key);

      if (savedPosition) {

        try {

          const position =
            JSON.parse(savedPosition);

          icon.style.left =
            position.x + "px";

          icon.style.top =
            position.y + "px";

        } catch (error) {

          console.warn(
            "Could not restore icon position:",
            error
          );

        }

      } else {

        if (defaultPositions[index]) {

          icon.style.left =
            defaultPositions[index][0] + "px";

          icon.style.top =
            defaultPositions[index][1] + "px";
        }
      }

      icon.addEventListener("mousedown", function (event) {

        if (event.button !== 0) return;

        draggedIcon = icon;

        const rect =
          icon.getBoundingClientRect();

        offsetX =
          event.clientX - rect.left;

        offsetY =
          event.clientY - rect.top;

        icon.classList.add("dragging");

        event.preventDefault();
      });

      icon.addEventListener(
        "touchstart",
        function (event) {

          const touch =
            event.touches[0];

          const rect =
            icon.getBoundingClientRect();

          draggedIcon = icon;

          offsetX =
            touch.clientX - rect.left;

          offsetY =
            touch.clientY - rect.top;

          icon.classList.add("dragging");

        },
        { passive: true }
      );

    });

    document.addEventListener("mousemove", function (event) {

      if (!draggedIcon) return;

      const desktopRect =
        desktop.getBoundingClientRect();

      let x =
        event.clientX -
        desktopRect.left -
        offsetX;

      let y =
        event.clientY -
        desktopRect.top -
        offsetY;

      const maxX =
        desktop.clientWidth -
        draggedIcon.offsetWidth;

      const maxY =
        desktop.clientHeight -
        draggedIcon.offsetHeight;

      x =
        Math.max(
          0,
          Math.min(x, maxX)
        );

      y =
        Math.max(
          0,
          Math.min(y, maxY)
        );

      draggedIcon.style.left =
        x + "px";

      draggedIcon.style.top =
        y + "px";
    });

    document.addEventListener(
      "touchmove",
      function (event) {

        if (!draggedIcon) return;

        const touch =
          event.touches[0];

        const desktopRect =
          desktop.getBoundingClientRect();

        let x =
          touch.clientX -
          desktopRect.left -
          offsetX;

        let y =
          touch.clientY -
          desktopRect.top -
          offsetY;

        const maxX =
          desktop.clientWidth -
          draggedIcon.offsetWidth;

        const maxY =
          desktop.clientHeight -
          draggedIcon.offsetHeight;

        x =
          Math.max(
            0,
            Math.min(x, maxX)
          );

        y =
          Math.max(
            0,
            Math.min(y, maxY)
          );

        draggedIcon.style.left =
          x + "px";

        draggedIcon.style.top =
          y + "px";

      },
      { passive: false }
    );

    document.addEventListener("mouseup", function () {

      if (!draggedIcon) return;

      saveIconPosition(draggedIcon);

      draggedIcon.classList.remove("dragging");

      draggedIcon = null;
    });

    document.addEventListener("touchend", function () {

      if (!draggedIcon) return;

      saveIconPosition(draggedIcon);

      draggedIcon.classList.remove("dragging");

      draggedIcon = null;
    });

    function saveIconPosition(icon) {

      const key =
        "desktop-icon-" +
        (icon.dataset.icon || "unknown");

      const position = {

        x: parseInt(icon.style.left) || 0,

        y: parseInt(icon.style.top) || 0
      };

      localStorage.setItem(
        key,
        JSON.stringify(position)
      );
    }

  });
</script>

<!-- =================================================
     KRIS COMPANION SYSTEM
     ================================================= -->

<script>
  document.addEventListener("DOMContentLoaded", function () {

    const kris =
      document.getElementById("kris-companion");

    const desktop =
      document.getElementById("desktop");

    const dialogue =
      document.getElementById("kris-dialogue");

    const dialogueText =
      document.getElementById("kris-dialogue-text");

    if (!kris || !desktop || !dialogue || !dialogueText) {
      console.error(
        "Kris Companion: Missing required element."
      );
      return;
    }

    let dragging = false;
    let offsetX = 0;
    let offsetY = 0;
    let dialogueTimer = null;

    const quotes = [
      "what are you doing.",
      "you opened that?",
      "wow.",
      "interesting.",
      "are you lost?",
      "i'm watching you.",
      "you really like clicking things.",
      "what are you looking for?",
      "this is productive.",
      "sure.",
      "why are you still here?",
      "i saw that.",
      "stop clicking everything.",
      "okay.",
      "fascinating.",
      "windows xp.",
      "this website is weird.",
      "you know i'm dancing, right?",
      "you have too much free time.",
      "i'm judging you.",
      "..."
    ];

    const dragQuotes = [
      "hey.",
      "why are you moving me?",
      "put me down.",
      "seriously?",
      "where are we going?",
      "stop dragging me.",
      "i was comfortable there.",
      "bro."
    ];

    function randomQuote(list) {
      return list[
        Math.floor(
          Math.random() * list.length
        )
      ];
    }

    function talk(message, duration = 3500) {

      clearTimeout(dialogueTimer);

      dialogueText.textContent = message;

      dialogue.classList.remove("hidden");

      dialogueTimer = setTimeout(function () {
        dialogue.classList.add("hidden");
      }, duration);
    }

    /* DRAG KRIS */

    kris.addEventListener("mousedown", function (event) {

      if (event.button !== 0) return;

      /* Stop Kris clicks from ever reaching the desktop/icon drag system */
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();

      dragging = true;

      const rect =
        kris.getBoundingClientRect();

      offsetX =
        event.clientX - rect.left;

      offsetY =
        event.clientY - rect.top;

      kris.classList.add("dragging");

      talk(
        randomQuote(dragQuotes),
        1800
      );
    }, true);

    document.addEventListener("mousemove", function (event) {

      if (!dragging) return;

      event.preventDefault();
      event.stopPropagation();

      const desktopRect =
        desktop.getBoundingClientRect();

      let x =
        event.clientX -
        desktopRect.left -
        offsetX;

      let y =
        event.clientY -
        desktopRect.top -
        offsetY;

      const maxX =
        Math.max(
          0,
          desktop.clientWidth -
          kris.offsetWidth
        );

      const maxY =
        Math.max(
          0,
          desktop.clientHeight -
          kris.offsetHeight
        );

      x =
        Math.max(
          0,
          Math.min(x, maxX)
        );

      y =
        Math.max(
          0,
          Math.min(y, maxY)
        );

      kris.style.left =
        x + "px";

      kris.style.top =
        y + "px";
    }, true);

    document.addEventListener("mouseup", function (event) {

      if (!dragging) return;

      event.preventDefault();
      event.stopPropagation();

      dragging = false;

      kris.classList.remove("dragging");

      localStorage.setItem(
        "kris-companion-position",
        JSON.stringify({
          x:
            parseInt(kris.style.left) || 0,
          y:
            parseInt(kris.style.top) || 0
        })
      );
    }, true);

    /* RESTORE KRIS POSITION */

    const savedPosition =
      localStorage.getItem(
        "kris-companion-position"
      );

    if (savedPosition) {

      try {

        const position =
          JSON.parse(savedPosition);

        kris.style.left =
          position.x + "px";

        kris.style.top =
          position.y + "px";

      } catch (error) {

        console.warn(
          "Kris Companion: Couldn't restore position.",
          error
        );

      }

    }

    /* FIRST MESSAGE */

    setTimeout(function () {
      talk(
        "oh. you found me.",
        4000
      );
    }, 1500);

    /* RANDOM COMMENTS */

    function randomComment() {

      if (!dragging) {
        talk(
          randomQuote(quotes)
        );
      }

      const nextDelay =
        12000 +
        Math.random() * 18000;

      setTimeout(
        randomComment,
        nextDelay
      );
    }

    setTimeout(
      randomComment,
      8000
    );

  });
</script>
