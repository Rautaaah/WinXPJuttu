    <style>
      /*
       * =====================================================
       * DRAGGABLE DESKTOP ICONS
       * =====================================================
       */

      #desktop {
        position: relative;
        width: 100vw;
        height: calc(100vh - 30px);
        padding: 0;
      }

      #desktop .icon {
        position: absolute;
        margin: 0;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
      }

      #desktop .icon.dragging {
        z-index: 9999;
        opacity: 0.85;
      }

      /*
       * Prevent the centered folder from being controlled
       * by the old fixed positioning.
       */
      #centered-folder {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
    </style>

  <body>

    <div
      id="main-content"
      style="
        background-repeat: no-repeat;
        background-position: center center;
        background-attachment: fixed;
        background-size: cover;
        min-height: 100vh;
      "
    >

      <!-- =================================================
           TIME-BASED WALLPAPER
           ================================================= -->

      <script>
        function updateDesktopWallpaper() {
          const hour = new Date().getHours();

          let wallpaper;

          // 🌅 MORNING — 06:00 to 11:59
          if (hour >= 6 && hour < 12) {
            wallpaper =
              "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdHV6ZTR1Zzg4NTF3dHZsOW1vNGtoOGxncTRybGpsamw1bHQzMWt0MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13ZzYXkeIjcZy0/giphy.gif";
          }

          // 🌸 AFTERNOON — 12:00 to 17:59
          else if (hour >= 12 && hour < 18) {
            wallpaper =
              "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExam5kM2l4bGt3bzZnZWRxbGR2MWxsZ2VuNzVsdmczZ2d4Z2J1bjRtMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NKicvKt6iisXS/giphy.gif";
          }

          // 🌙 NIGHT — 18:00 to 05:59
          else {
            wallpaper =
              "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcmhsaDV5eDc4am52aXA3YzBlN21jNnRrOWt0c2xlbjBnZWNiaGJ0NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lR5poYluERnRuaGQOd/giphy.gif";
          }

          const desktop = document.getElementById("main-content");

          if (desktop) {
            desktop.style.backgroundImage = `url("${wallpaper}")`;
          }
        }

        // Set wallpaper immediately
        updateDesktopWallpaper();

        // Check every minute
        setInterval(updateDesktopWallpaper, 60000);
      </script>

    <!-- =================================================
         DRAG & DROP SYSTEM
         ================================================= -->

    <script>
      document.addEventListener("DOMContentLoaded", function () {

        const desktop = document.getElementById("desktop");

        if (!desktop) return;

        const icons = desktop.querySelectorAll(".icon");

        let draggedIcon = null;
        let offsetX = 0;
        let offsetY = 0;

        /*
         * Default positions.
         * These are only used if the icon has never
         * been moved before.
         */

        const defaultPositions = [
          [20, 20],    // My Computer
          [20, 90],    // Recycle Bin
          [20, 160],   // Internet Explorer
          [20, 230],   // Minesweeper
          [20, 300],   // Pinball
          [20, 370],   // Paint
          [20, 440],   // Notepad
          [20, 510],   // Winamp
        ];


        icons.forEach((icon, index) => {

          const key =
            "desktop-icon-" +
            (icon.dataset.icon || index);

          /*
           * Restore saved position
           */

          const savedPosition =
            localStorage.getItem(key);

          if (savedPosition) {

            try {

              const position =
                JSON.parse(savedPosition);

              icon.style.left =
                position.x + "px";

              icon.style.top =
                position.y + "px";

            } catch (error) {

              console.warn(
                "Could not restore icon position:",
                error
              );

            }

          } else {

            /*
             * Set default position
             */

            if (defaultPositions[index]) {

              icon.style.left =
                defaultPositions[index][0] + "px";

              icon.style.top =
                defaultPositions[index][1] + "px";
            }
          }


          /*
           * Mouse down
           */

          icon.addEventListener("mousedown", function (event) {

            /*
             * Only left mouse button
             */

            if (event.button !== 0) return;

            draggedIcon = icon;

            const rect =
              icon.getBoundingClientRect();

            offsetX =
              event.clientX - rect.left;

            offsetY =
              event.clientY - rect.top;

            icon.classList.add("dragging");

            event.preventDefault();
          });


          /*
           * Touch support
           */

          icon.addEventListener(
            "touchstart",
            function (event) {

              const touch =
                event.touches[0];

              const rect =
                icon.getBoundingClientRect();

              draggedIcon = icon;

              offsetX =
                touch.clientX - rect.left;

              offsetY =
                touch.clientY - rect.top;

              icon.classList.add("dragging");

            },
            { passive: true }
          );

        });


        /*
         * Mouse movement
         */

        document.addEventListener("mousemove", function (event) {

          if (!draggedIcon) return;

          const desktopRect =
            desktop.getBoundingClientRect();

          let x =
            event.clientX -
            desktopRect.left -
            offsetX;

          let y =
            event.clientY -
            desktopRect.top -
            offsetY;


          /*
           * Keep icon inside desktop
           */

          const maxX =
            desktop.clientWidth -
            draggedIcon.offsetWidth;

          const maxY =
            desktop.clientHeight -
            draggedIcon.offsetHeight;


          x =
            Math.max(
              0,
              Math.min(x, maxX)
            );

          y =
            Math.max(
              0,
              Math.min(y, maxY)
            );


          draggedIcon.style.left =
            x + "px";

          draggedIcon.style.top =
            y + "px";
        });


        /*
         * Touch movement
         */

        document.addEventListener(
          "touchmove",
          function (event) {

            if (!draggedIcon) return;

            const touch =
              event.touches[0];

            const desktopRect =
              desktop.getBoundingClientRect();

            let x =
              touch.clientX -
              desktopRect.left -
              offsetX;

            let y =
              touch.clientY -
              desktopRect.top -
              offsetY;


            const maxX =
              desktop.clientWidth -
              draggedIcon.offsetWidth;

            const maxY =
              desktop.clientHeight -
              draggedIcon.offsetHeight;


            x =
              Math.max(
                0,
                Math.min(x, maxX)
              );

            y =
              Math.max(
                0,
                Math.min(y, maxY)
              );


            draggedIcon.style.left =
              x + "px";

            draggedIcon.style.top =
              y + "px";

          },
          { passive: false }
        );


        /*
         * Mouse release
         */

        document.addEventListener("mouseup", function () {

          if (!draggedIcon) return;

          saveIconPosition(draggedIcon);

          draggedIcon.classList.remove("dragging");

          draggedIcon = null;
        });


        /*
         * Touch release
         */

        document.addEventListener("touchend", function () {

          if (!draggedIcon) return;

          saveIconPosition(draggedIcon);

          draggedIcon.classList.remove("dragging");

          draggedIcon = null;
        });


        /*
         * Save icon position
         */

        function saveIconPosition(icon) {

          const key =
            "desktop-icon-" +
            (icon.dataset.icon || "unknown");

          const position = {

            x: parseInt(icon.style.left) || 0,

            y: parseInt(icon.style.top) || 0
          };


          localStorage.setItem(
            key,
            JSON.stringify(position)
          );
        }

      });
    </script>
