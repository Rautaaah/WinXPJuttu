  <script>

    function updateDesktopWallpaper() {

      const hour =
        new Date().getHours();

      let wallpaper;


      /*
       * MORNING
       * 06:00 - 11:59
       */

      if (
        hour >= 6 &&
        hour < 12
      ) {

        wallpaper =
          "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdHV6ZTR1Zzg4NTF3dHZsOW1vNGtoOGxncTRybGpsamw1bHQzMWt0MCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/13ZzYXkeIjcZy0/giphy.gif";

      }


      /*
       * AFTERNOON
       * 12:00 - 17:59
       */

      else if (
        hour >= 12 &&
        hour < 18
      ) {

        wallpaper =
          "https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExam5kM2l4bGt3bzZnZWRxbGR2MWxsZ2VuNzVsdmczZ2d4Z2J1bjRtMSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/NKicvKt6iisXS/giphy.gif";

      }


      /*
       * NIGHT
       * 18:00 - 05:59
       */

      else {

        wallpaper =
          "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcmhsaDV5eDc4am52aXA3YzBlN21jNnRrOWt0c2xlbjBnZWNiaGJ0NiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/lR5poYluERnRuaGQOd/giphy.gif";

      }


      const desktop =
        document.getElementById(
          "main-content"
        );


      if (desktop) {

        desktop.style.backgroundImage =
          `url("${wallpaper}")`;

      }

    }


    updateDesktopWallpaper();


    setInterval(
      updateDesktopWallpaper,
      60000
    );

  </script>

<!-- =====================================================
     DESKTOP ICON DRAG SYSTEM
     ===================================================== -->

<script>

document.addEventListener(
  "DOMContentLoaded",
  function () {


    const desktop =
      document.getElementById(
        "desktop"
      );


    if (!desktop) return;


    const icons =
      Array.from(
        desktop.querySelectorAll(
          ".icon"
        )
      );


    let draggedIcon = null;

    let offsetX = 0;

    let offsetY = 0;


    /*
     * =================================================
     * GRID SETTINGS
     * =================================================
     *
     * X controls horizontal spacing.
     *
     * Y controls vertical spacing.
     *
     * The icons are still completely free while
     * being dragged.
     *
     * They ONLY snap after you release them.
     */

    const GRID_X = 20;

    const GRID_Y = 70;


    /*
     * Extra spacing around icons.
     *
     * This prevents icons that are extremely close
     * from touching each other.
     */

    const ICON_GAP = 8;


    /*
     * =================================================
     * DEFAULT POSITIONS
     * =================================================
     */

    const defaultPositions = [

      [20, 20],

      [20, 90],

      [20, 160],

      [20, 230],

      [20, 300],

      [20, 370],

      [20, 440],

      [20, 510]

    ];


    /*
     * =================================================
     * GET RECTANGLE AT A POSITION
     * =================================================
     */

    function getIconRect(
      icon,
      x,
      y
    ) {

      return {

        left: x,

        top: y,

        right:
          x +
          icon.offsetWidth,

        bottom:
          y +
          icon.offsetHeight

      };

    }


    /*
     * =================================================
     * RECTANGLE COLLISION
     * =================================================
     *
     * Returns TRUE when two icons overlap OR
     * are close enough to visually touch.
     */

    function rectanglesTouch(
      a,
      b
    ) {

      return !(
        a.right + ICON_GAP <= b.left ||

        a.left >= b.right + ICON_GAP ||

        a.bottom + ICON_GAP <= b.top ||

        a.top >= b.bottom + ICON_GAP
      );

    }


    /*
     * =================================================
     * POSITION AVAILABLE?
     * =================================================
     */

    function positionIsAvailable(
      icon,
      x,
      y
    ) {

      const testRect =
        getIconRect(
          icon,
          x,
          y
        );


      for (
        const otherIcon of icons
      ) {

        if (
          otherIcon === icon
        ) {
          continue;
        }


        const otherX =
          parseInt(
            otherIcon.style.left
          ) || 0;


        const otherY =
          parseInt(
            otherIcon.style.top
          ) || 0;


        const otherRect =
          getIconRect(
            otherIcon,
            otherX,
            otherY
          );


        if (
          rectanglesTouch(
            testRect,
            otherRect
          )
        ) {

          return false;

        }

      }


      return true;

    }


    /*
     * =================================================
     * SNAP TO GRID
     * =================================================
     */

    function snapToGrid(
      x,
      y
    ) {

      return {

        x:
          Math.round(
            x / GRID_X
          ) * GRID_X,

        y:
          Math.round(
            y / GRID_Y
          ) * GRID_Y

      };

    }


    /*
     * =================================================
     * FIND NEAREST FREE GRID POSITION
     * =================================================
     *
     * If the user releases an icon on another icon,
     * we search outward from that position until we
     * find an empty grid location.
     */

    function findNearestFreePosition(
      icon,
      desiredX,
      desiredY
    ) {

      const snapped =
        snapToGrid(
          desiredX,
          desiredY
        );


      /*
       * First try the exact grid position.
       */

      if (
        positionIsAvailable(
          icon,
          snapped.x,
          snapped.y
        )
      ) {

        return snapped;

      }


      /*
       * Search outward in a spiral-ish pattern.
       *
       * This makes the icon move to the closest
       * available grid position.
       */

      const maxRadius = 30;


      for (
        let radius = 1;
        radius <= maxRadius;
        radius++
      ) {

        const candidates = [];


        /*
         * Top
         */

        candidates.push({

          x:
            snapped.x,

          y:
            snapped.y -
            radius *
            GRID_Y

        });


        /*
         * Bottom
         */

        candidates.push({

          x:
            snapped.x,

          y:
            snapped.y +
            radius *
            GRID_Y

        });


        /*
         * Left
         */

        candidates.push({

          x:
            snapped.x -
            radius *
            GRID_X,

          y:
            snapped.y

        });


        /*
         * Right
         */

        candidates.push({

          x:
            snapped.x +
            radius *
            GRID_X,

          y:
            snapped.y

        });


        /*
         * Diagonals
         */

        candidates.push({

          x:
            snapped.x -
            radius *
            GRID_X,

          y:
            snapped.y -
            radius *
            GRID_Y

        });


        candidates.push({

          x:
            snapped.x +
            radius *
            GRID_X,

          y:
            snapped.y -
            radius *
            GRID_Y

        });


        candidates.push({

          x:
            snapped.x -
            radius *
            GRID_X,

          y:
            snapped.y +
            radius *
            GRID_Y

        });


        candidates.push({

          x:
            snapped.x +
            radius *
            GRID_X,

          y:
            snapped.y +
            radius *
            GRID_Y

        });


        /*
         * Test every candidate.
         */

        for (
          const candidate of candidates
        ) {

          /*
           * Don't let icons go off-screen.
           */

          const maxX =
            Math.max(
              0,
              desktop.clientWidth -
              icon.offsetWidth
            );


          const maxY =
            Math.max(
              0,
              desktop.clientHeight -
              icon.offsetHeight
            );


          if (
            candidate.x < 0 ||
            candidate.y < 0 ||
            candidate.x > maxX ||
            candidate.y > maxY
          ) {

            continue;

          }


          if (
            positionIsAvailable(
              icon,
              candidate.x,
              candidate.y
            )
          ) {

            return candidate;

          }

        }

      }


      /*
       * Fallback:
       *
       * Search every grid position on the desktop.
       */

      for (
        let y = 0;
        y < desktop.clientHeight;
        y += GRID_Y
      ) {

        for (
          let x = 0;
          x < desktop.clientWidth;
          x += GRID_X
        ) {

          if (
            positionIsAvailable(
              icon,
              x,
              y
            )
          ) {

            return {
              x: x,
              y: y
            };

          }

        }

      }


      /*
       * If somehow there is literally no space,
       * keep the original snapped position.
       */

      return snapped;

    }


    /*
     * =================================================
     * RESTORE ICON POSITIONS
     * =================================================
     */

    icons.forEach(
      function (
        icon,
        index
      ) {

        const key =
          "desktop-icon-" +
          (
            icon.dataset.icon ||
            index
          );


        const savedPosition =
          localStorage.getItem(
            key
          );


        if (
          savedPosition
        ) {

          try {

            const position =
              JSON.parse(
                savedPosition
              );


            icon.style.left =
              position.x +
              "px";


            icon.style.top =
              position.y +
              "px";

          }

          catch (error) {

            console.warn(
              "Could not restore icon position:",
              error
            );

          }

        }

        else if (
          defaultPositions[index]
        ) {

          icon.style.left =
            defaultPositions[index][0] +
            "px";


          icon.style.top =
            defaultPositions[index][1] +
            "px";

        }


        /*
         * =================================================
         * MOUSE DOWN
         * =================================================
         */

        icon.addEventListener(
          "mousedown",
          function (event) {

            if (
              event.button !== 0
            ) return;


            draggedIcon =
              icon;


            const rect =
              icon.getBoundingClientRect();


            offsetX =
              event.clientX -
              rect.left;


            offsetY =
              event.clientY -
              rect.top;


            icon.classList.add(
              "dragging"
            );


            event.preventDefault();

          }
        );


        /*
         * =================================================
         * TOUCH START
         * =================================================
         */

        icon.addEventListener(
          "touchstart",
          function (event) {

            const touch =
              event.touches[0];


            const rect =
              icon.getBoundingClientRect();


            draggedIcon =
              icon;


            offsetX =
              touch.clientX -
              rect.left;


            offsetY =
              touch.clientY -
              rect.top;


            icon.classList.add(
              "dragging"
            );

          },
          {
            passive: true
          }
        );

      }
    );


    /*
     * =================================================
     * MOUSE MOVE
     * =================================================
     *
     * IMPORTANT:
     *
     * NO GRID SNAP HERE.
     *
     * The icon moves completely freely.
     */

    document.addEventListener(
      "mousemove",
      function (event) {

        if (
          !draggedIcon
        ) return;


        const desktopRect =
          desktop.getBoundingClientRect();


        let x =
          event.clientX -
          desktopRect.left -
          offsetX;


        let y =
          event.clientY -
          desktopRect.top -
          offsetY;


        const maxX =
          desktop.clientWidth -
          draggedIcon.offsetWidth;


        const maxY =
          desktop.clientHeight -
          draggedIcon.offsetHeight;


        x =
          Math.max(
            0,
            Math.min(
              x,
              maxX
            )
          );


        y =
          Math.max(
            0,
            Math.min(
              y,
              maxY
            )
          );


        /*
         * FREE MOVEMENT.
         */

        draggedIcon.style.left =
          x +
          "px";


        draggedIcon.style.top =
          y +
          "px";

      }
    );


    /*
     * =================================================
     * TOUCH MOVE
     * =================================================
     */

    document.addEventListener(
      "touchmove",
      function (event) {

        if (
          !draggedIcon
        ) return;


        const touch =
          event.touches[0];


        const desktopRect =
          desktop.getBoundingClientRect();


        let x =
          touch.clientX -
          desktopRect.left -
          offsetX;


        let y =
          touch.clientY -
          desktopRect.top -
          offsetY;


        const maxX =
          desktop.clientWidth -
          draggedIcon.offsetWidth;


        const maxY =
          desktop.clientHeight -
          draggedIcon.offsetHeight;


        x =
          Math.max(
            0,
            Math.min(
              x,
              maxX
            )
          );


        y =
          Math.max(
            0,
            Math.min(
              y,
              maxY
            )
          );


        draggedIcon.style.left =
          x +
          "px";


        draggedIcon.style.top =
          y +
          "px";


        event.preventDefault();

      },
      {
        passive: false
      }
    );


    /*
     * =================================================
     * RELEASE ICON
     * =================================================
     */

    document.addEventListener(
      "mouseup",
      function () {

        if (
          !draggedIcon
        ) return;


        const currentX =
          parseInt(
            draggedIcon.style.left
          ) || 0;


        const currentY =
          parseInt(
            draggedIcon.style.top
          ) || 0;


        /*
         * SNAP ONLY NOW.
         */

        const finalPosition =
          findNearestFreePosition(
            draggedIcon,
            currentX,
            currentY
          );


        draggedIcon.style.left =
          finalPosition.x +
          "px";


        draggedIcon.style.top =
          finalPosition.y +
          "px";


        saveIconPosition(
          draggedIcon
        );


        draggedIcon.classList.remove(
          "dragging"
        );


        draggedIcon =
          null;

      }
    );


    /*
     * =================================================
     * RELEASE TOUCH
     * =================================================
     */

    document.addEventListener(
      "touchend",
      function () {

        if (
          !draggedIcon
        ) return;


        const currentX =
          parseInt(
            draggedIcon.style.left
          ) || 0;


        const currentY =
          parseInt(
            draggedIcon.style.top
          ) || 0;


        /*
         * SNAP ONLY WHEN RELEASED.
         */

        const finalPosition =
          findNearestFreePosition(
            draggedIcon,
            currentX,
            currentY
          );


        draggedIcon.style.left =
          finalPosition.x +
          "px";


        draggedIcon.style.top =
          finalPosition.y +
          "px";


        saveIconPosition(
          draggedIcon
        );


        draggedIcon.classList.remove(
          "dragging"
        );


        draggedIcon =
          null;

      }
    );


    /*
     * =================================================
     * SAVE POSITION
     * =================================================
     */

    function saveIconPosition(
      icon
    ) {

      const key =
        "desktop-icon-" +
        (
          icon.dataset.icon ||
          "unknown"
        );


      const position = {

        x:
          parseInt(
            icon.style.left
          ) || 0,

        y:
          parseInt(
            icon.style.top
          ) || 0

      };


      localStorage.setItem(
        key,
        JSON.stringify(
          position
        )
      );

    }

  }
);

</script>
