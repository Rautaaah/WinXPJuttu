<style>
  /* BIOS GIF boot screen */
  #bios-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    background-image: url("Assets/biosgif.gif");
    background-size: 55% auto;
    background-position: top left;
    background-repeat: no-repeat;
    background-color: #000000;

    opacity: 1;
    visibility: visible;

    transition: opacity 0.3s ease;
  }

  /* Hide the BIOS screen after 10 seconds */
  #bios-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
</style>

  <body>
    <!-- ========================================= -->
    <!-- BIOS GIF — PLAYS FOR 10 SECONDS          -->
    <!-- ========================================= -->


<div id="bios-screen"></div>

<!-- ========================================= -->
<!-- YOUR ORIGINAL XP LOADER                  -->
<!-- ========================================= -->

<div id="loader">

    alt="Windows XP Logo"

  />

    src="/Assets/Images/Copyright.png"

    id="Microsoft"
  />
</div>

<!-- ========================================= -->
<!-- LOGIN SCREEN                             -->
<!-- ========================================= -->

<div id="login-screen" class="hidden">
  <div id="top-bar"></div>

  <div id="content">
    <div id="left-panel">
      <img
        src="/Assets/Images/White writting Windows XP logo.png"
        alt="Windows XP Logo"

      />

      <p>To begin, click your user name</p>
    </div>

    <div id="user-list">
      <div class="user" id="guest-user" onclick="loginAsGuest()">

          src="/Assets/Images/Flower PP.png"

        <div class="user-text">
          <span>YOUUU!!! :3 &lt;3</span>
        </div>

  </div>

  <div id="bottom-bar">
    <div id="left-section">
      <img

      />

      <p id="shutdown-p" onclick="turnOffComputer()">
        Turn off computer
      </p>
    </div>

    <p id="right-text">
      After you log on, you can add or change accounts.<br />
      Just go to Control Panel and click User Accounts.
    </p>
  </div>
</div>

<!-- ========================================= -->
<!-- BIOS TIMER                               -->
<!-- ========================================= -->

<script>
  window.addEventListener("load", function () {
    setTimeout(function () {
      document.getElementById("bios-screen").classList.add("hidden");
    }, 10000);
  });
</script>

<!-- ========================================= -->
<!-- ANIMATED BROWSER TITLE                   -->
<!-- ========================================= -->

<script>
  const titleText = "RAUTATIENTORI";
  let titleIndex = 1;

  function animateTitle() {
    document.title = titleText.substring(0, titleIndex);

    titleIndex++;

    if (titleIndex > titleText.length) {
      titleIndex = 1;
    }

    const delay =
      document.visibilityState === "visible"
        ? 100
        : 300;

    setTimeout(animateTitle, delay);
  }

  animateTitle();
</script>


  </body>
