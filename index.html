<html lang="fr">

<style>
  /* ==========================================
     BIOS GIF SCREEN
     ========================================== */

  #bios-screen {
    position: fixed;
    inset: 0;

    width: 100vw;
    height: 100vh;

    background-image: url("/Assets/biosgif.gif");
    background-size: 55% auto;
    background-position: top left;
    background-repeat: no-repeat;
    background-color: #000000;

    z-index: 99999;
  }

  #bios-screen.hidden {
    display: none;
  }
</style>


  </head>

  <body>


<!-- ==================================================
     BIOS GIF
     This stays visible for 10 seconds.
     ================================================== -->

<div id="bios-screen"></div>


<!-- ==================================================
     WINDOWS XP LOADING SCREEN

     IMPORTANT:
     This is NOT hidden.

     The BIOS screen is simply covering it for
     the first 10 seconds.

     After the BIOS disappears, this becomes visible.
     ================================================== -->

<div id="loader">

  <img
    src="/Assets/Images/Windows_XP_SP2_Boot_screen cropped.png"
    alt="Windows XP Logo"
    id="logo"
  />

  <div id="progress-bar">

    <div class="progress-block"></div>
    <div class="progress-block"></div>
    <div class="progress-block"></div>

  </div>

  <img
    src="/Assets/Images/Microsoft logo démarrage.png"
    alt="Logo Microsoft en bas à droite sur l'écran de démarrage"
    id="Copyright"
  />

  <img
    src="/Assets/Images/Copyright.png"
    alt="Copyright de Microsoft Corporation"
    id="Microsoft"
  />

</div>


<!-- ==================================================
     WINDOWS XP LOGIN SCREEN

     This stays hidden until Loader_Login.js
     finishes its startup sequence.
     ================================================== -->

<div id="login-screen" class="hidden">

  <div id="top-bar"></div>

  <div id="content">

    <div id="left-panel">

      <img
        src="/Assets/Images/White writting Windows XP logo.png"
        alt="Windows XP Logo"
        id="xp-logo"
      />

      <p>To begin, click your user name</p>

    </div>


    <div id="user-list">

      <div
        class="user"
        id="guest-user"
        onclick="loginAsGuest()"
      >

        <img
          src="/Assets/Images/Flower PP.png"
          alt="Guest"
        />

        <div class="user-text">

          <span>YOUUU!!! :3 &lt;3</span>

        </div>

      </div>

    </div>

  </div>


  <div id="bottom-bar">

    <div id="left-section">

      <img
        id="Power"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Power.png"
        alt="Turn off computer button"
        onclick="turnOffComputer()"
      />

      <p
        id="shutdown-p"
        onclick="turnOffComputer()"
      >
        Turn off computer
      </p>

    </div>


    <p id="right-text">

      After you log on, you can add or change accounts.<br />

      Just go to Control Panel and click User Accounts.

    </p>

  </div>

</div>


<!-- ==================================================
     BIOS → WINDOWS XP LOADER

     We DO NOT hide/show #loader here.

     #loader is already present underneath the BIOS.

     The BIOS simply gets removed after 10 seconds.

     Loader_Login.js then waits its normal 4 seconds
     before moving to the transition.
     ================================================== -->

<script>
  window.addEventListener("load", function () {

    setTimeout(function () {

      const biosScreen =
        document.getElementById("bios-screen");

      if (biosScreen) {
        biosScreen.classList.add("hidden");
      }

    }, 10000);

  });
</script>


<!-- ==================================================
     ANIMATED BROWSER TITLE
     ================================================== -->

<script>
  const titleText = "RAUTATIENTORI";
  let titleIndex = 1;

  function animateTitle() {

    document.title =
      titleText.substring(0, titleIndex);

    titleIndex++;

    if (titleIndex > titleText.length) {
      titleIndex = 1;
    }

    const delay =
      document.visibilityState === "visible"
        ? 100
        : 300;

    setTimeout(animateTitle, delay);
  }

  animateTitle();
</script>


  </body>
</html>
