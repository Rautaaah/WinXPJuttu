
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>𝖂𝖔𝖜𝕷𝖔𝖆𝖉𝖎𝖓𝖌𝕭𝖎𝖔𝖘</title>

    <link
        rel="icon"
        type="image/ico"
        sizes="32x32"
        href="/Assets/Images/Windows_XP-min.ico"
    />

    <!-- XP CSS can load while the GIF is playing.
         It does NOT advance anything by itself. -->

    <link
        rel="preload"
        href="/Start_Menu/Log_Off/Base/Log_Off.css"
        as="style"
        onload="this.onload=null;this.rel='stylesheet';"
    />

    <link rel="stylesheet" href="/Loader_Login/Loader.css" />
    <link rel="stylesheet" href="/Loader_Login/Login_Screen.css" />

    <style>
        /* ============================= */
        /* BIOS GIF INTRO                 */
        /* ============================= */

        #intro {
            position: fixed;
            inset: 0;

            background-image: url('Assets/biosgif.gif');
            background-size: 55% auto;
            background-position: top left;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000000;

            z-index: 999999;
        }

        /* XP system is completely hidden
           until the GIF is finished */

        #xp-page {
            display: none;
        }
    </style>
</head>

<body>

    <!-- ============================= -->
    <!-- 10 SECOND BIOS GIF             -->
    <!-- ============================= -->

    <div id="intro"></div>


    <!-- ============================= -->
    <!-- WINDOWS XP PAGE                -->
    <!-- ============================= -->

    <div id="xp-page">

        <!-- ========================= -->
        <!-- XP LOADER                  -->
        <!-- ========================= -->

        <div id="loader">

            <img
                src="/Assets/Images/Windows_XP_SP2_Boot_screen cropped.png"
                alt="Windows XP Logo"
                id="logo"
            />

            <div id="progress-bar">
                <div class="progress-block"></div>
                <div class="progress-block"></div>
                <div class="progress-block"></div>
            </div>

            <img
                src="/Assets/Images/Microsoft logo démarrage.png"
                alt="Logo Microsoft"
                id="Copyright"
            />

            <img
                src="/Assets/Images/Copyright.png"
                alt="Copyright Microsoft"
                id="Microsoft"
            />

        </div>


        <!-- ========================= -->
        <!-- LOGIN SCREEN               -->
        <!-- ========================= -->

        <div id="login-screen" class="hidden">

            <div id="top-bar"></div>

            <div id="content">

                <div id="left-panel">

                    <img
                        src="/Assets/Images/White writting Windows XP logo.png"
                        alt="Windows XP Logo"
                        id="xp-logo"
                    />

                    <p>To begin, click your user name</p>

                </div>


                <div id="user-list">

                    <div
                        class="user"
                        id="guest-user"
                        onclick="loginAsGuest()"
                    >

                        <img
                            src="/Assets/Images/Flower PP.png"
                            alt="Guest"
                        />

                        <div class="user-text">
                            <span>YOUUU!!! :3 &lt;3</span>
                        </div>

                    </div>

                </div>

            </div>


            <!-- ========================= -->
            <!-- BOTTOM BAR                 -->
            <!-- ========================= -->

            <div id="bottom-bar">

                <div id="left-section">

                    <img
                        id="Power"
                        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Power.png"
                        alt="Turn off computer button"
                        onclick="turnOffComputer()"
                    />

                    <p
                        id="shutdown-p"
                        onclick="turnOffComputer()"
                    >
                        Turn off computer
                    </p>

                </div>


                <p id="right-text">
                    After you log on, you can add or change accounts.<br />
                    Just go to Control Panel and click User Accounts.
                </p>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- ANIMATED BROWSER TITLE         -->
    <!-- ============================= -->

    <script>
        const titleText = "RAUTATIENTORI";
        let titleIndex = 1;

        function animateTitle() {

            document.title = titleText.substring(0, titleIndex);

            titleIndex++;

            if (titleIndex > titleText.length) {
                titleIndex = 1;
            }

            const delay =
                document.visibilityState === "visible"
                    ? 100
                    : 300;

            setTimeout(animateTitle, delay);
        }

        animateTitle();
    </script>


    <!-- ============================= -->
    <!-- WAIT 10 SECONDS                -->
    <!-- THEN START XP FROM THE START   -->
    <!-- ============================= -->

    <script>
        setTimeout(function () {

            /*
             * Remove the BIOS GIF completely.
             */
            const intro = document.getElementById("intro");

            if (intro) {
                intro.remove();
            }


            /*
             * Reveal the XP page.
             */
            const xpPage = document.getElementById("xp-page");

            if (xpPage) {
                xpPage.style.display = "block";
            }


            /*
             * NOW load Loader_Login.js.
             *
             * It was NOT running during the
             * 10-second GIF, so the XP loader
             * starts from the beginning.
             */
            const loaderScript = document.createElement("script");

            loaderScript.src = "/Loader_Login/Loader_Login.js";

            document.body.appendChild(loaderScript);


            /*
             * Load Bureau.js as well.
             */
            const bureauScript = document.createElement("script");

            bureauScript.src = "/Bureau/Bureau.js";

            document.body.appendChild(bureauScript);

        }, 10000);
    </script>

</body>
</html>
