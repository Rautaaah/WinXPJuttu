<!DOCTYPE html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


<title>R</title>

<link
  rel="icon"
  type="image/ico"
  sizes="32x32"
  href="/Assets/Images/Windows_XP-min.ico"
/>

<link
  rel="preload"
  href="/Start_Menu/Log_Off/Base/Log_Off.css"

  onload="this.onload=null;this.rel='stylesheet';"
/>

<link rel="stylesheet" href="/Loader_Login/Loader.css" />

<script src="/Loader_Login/Loader_Login.js"></script>
<script src="/Bureau/Bureau.js"></script>

<script>

<script defer src="/_vercel/speed-insights/script.js"></script>

<script>
  window.va =
    window.va ||
    function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
</script>

<style>
  /* =========================================
     BIOS GIF
     ========================================= */

  #bios-screen {
    position: fixed;
    inset: 0;
    z-index: 99999;

    background-image: url("assets/biosgif.gif");
    background-size: 55% auto;
    background-position: top left;
    background-repeat: no-repeat;
    background-color: #000000;
  }

  #bios-screen.hidden {
    display: none;
  }

  /* =========================================
     IMPORTANT:
     XP LOADER IS HIDDEN DURING BIOS SCREEN
     ========================================= */

  #loader.boot-wait {
    display: none !important;
  }
</style>


  </head>

  <body>


<!-- =========================================
     BIOS — 10 SECONDS
     ========================================= -->

<div id="bios-screen"></div>


<!-- =========================================
     WINDOWS XP LOADER
     Hidden until BIOS is finished
     ========================================= -->

<div id="loader" class="boot-wait">

  <img
    src="/Assets/Images/Windows_XP_SP2_Boot_screen cropped.png"
    alt="Windows XP Logo"
    id="logo"
  />

  <div id="progress-bar">
    <div class="progress-block"></div>
    <div class="progress-block"></div>
    <div class="progress-block"></div>
  </div>

  <img
    src="/Assets/Images/Microsoft logo démarrage.png"
    alt="Microsoft logo"
    id="Copyright"
  />

  <img
    src="/Assets/Images/Copyright.png"
    alt="Copyright de Microsoft Corporation"
    id="Microsoft"
  />

</div>


<!-- =========================================
     WINDOWS XP LOGIN
     ========================================= -->

<div id="login-screen" class="hidden">

  <div id="top-bar"></div>

  <div id="content">

    <div id="left-panel">

      <img
        src="/Assets/Images/White writting Windows XP logo.png"
        alt="Windows XP Logo"
        id="xp-logo"
      />

      <p>To begin, click your user name</p>

    </div>


    <div id="user-list">

      <div
        class="user"
        id="guest-user"
        onclick="loginAsGuest()"
      >

        <img
          src="/Assets/Images/Flower PP.png"
          alt="Guest"
        />

        <div class="user-text">
          <span>YOUUU!!! :3 &lt;3</span>
        </div>

      </div>

    </div>

  </div>


  <div id="bottom-bar">

    <div id="left-section">

      <img
        id="Power"
        src="/Assets/Windows XP High Resolution Icon Pack avec MAOSX/Windows XP High Resolution Icon Pack/Windows XP Icons/Power.png"
        alt="Turn off computer button"
        onclick="turnOffComputer()"
      />

      <p
        id="shutdown-p"
        onclick="turnOffComputer()"
      >
        Turn off computer
      </p>

    </div>


    <p id="right-text">
      After you log on, you can add or change accounts.<br />
      Just go to Control Panel and click User Accounts.
    </p>

  </div>

</div>


<!-- =========================================
     BIOS → XP LOADER
     ========================================= -->

<script>
  window.addEventListener("load", function () {

    setTimeout(function () {

      // Remove BIOS screen
      document
        .getElementById("bios-screen")
        .classList.add("hidden");

      // Reveal the EXISTING XP loader
      document
        .getElementById("loader")
        .classList.remove("boot-wait");

    }, 10000);

  });
</script>


<!-- =========================================
     ANIMATED BROWSER TITLE
     ========================================= -->

<script>
  const titleText = "RAUTATIENTORI";
  let titleIndex = 1;

  function animateTitle() {

    document.title =
      titleText.substring(0, titleIndex);

    titleIndex++;

    if (titleIndex > titleText.length) {
      titleIndex = 1;
    }

    const delay =
      document.visibilityState === "visible"
        ? 100
        : 300;

    setTimeout(animateTitle, delay);
  }

  animateTitle();
</script>


  </body>
</html>
